name: 内容过时
description: 报告一条已经变化的规则或政策
title: "[过时] "
labels: ["内容过时"]
body:
  - type: input
    id: entry
    attributes:
      label: 条目 ID
      placeholder: B-01
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: 哪条规则变了
      description: 写清旧说法和新说法
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 官方新链接
      placeholder: https://
    validations:
      required: true
  - type: input
    id: effective
    attributes:
      label: 生效日期
      placeholder: 2026-10-23
    validations:
      required: true
